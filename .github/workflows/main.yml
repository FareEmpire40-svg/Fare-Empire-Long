name: Auto Render Fare Empire Video

on:
  repository_dispatch:
    types: [render_and_upload]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_video:
    # 👇 Changed to stable ubuntu-22.04 to prevent Cloudflare package missing error 👇
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Cloudflare WARP (Bypass Microsoft IP Block)
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update
          # 👇 Fixed package name to cloudflare-warp 👇
          sudo apt-get install -y cloudflare-warp
          sudo warp-cli --accept-tos registration new
          sudo warp-cli --accept-tos mode warp
          sudo warp-cli --accept-tos connect
          sleep 5

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Libraries
        # 👇 Yahan --upgrade add kiya gaya hai taaki edge-tts hamesha update rahe 👇
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade requests aiohttp edge-tts

      - name: Run Video Rendering Script
        env:
          PYTHONUNBUFFERED: "1"
          
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
          # Payload Data from n8n Webhook
          SCENES_DATA: ${{ github.event.client_payload.scenes_data }}
          TITLE: ${{ github.event.client_payload.title }}
          DESCRIPTION: ${{ github.event.client_payload.description }}
          THUMBNAIL_PROMPT: ${{ github.event.client_payload.thumbnail_prompt }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
          
          FALLBACK_KEYWORDS: ${{ github.event.client_payload.fallback_keywords }}
          
          # Repository Secrets
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          
        run: python render_video.py

      - name: Auto-delete older releases
        uses: dev-drprasad/delete-older-releases@v0.3.3
        with:
          keep_latest: 3
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
